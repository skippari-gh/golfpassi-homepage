<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golfpassi maailmalla</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f4ee;color:#163247}.app{min-height:100vh;padding:24px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:#00aaff;color:#003c70;display:grid;place-items:center;font-weight:900;font-size:22px}.eyebrow{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:#00aaff;font-weight:900}.title{font-size:clamp(38px,5vw,68px);font-weight:900;letter-spacing:-.055em;line-height:.92}.date{color:#71838f;font-weight:700;font-size:13px}.map{position:relative;min-height:590px;border:1px solid rgba(20,52,70,.12);border-radius:32px;overflow:hidden;background:#eaf4f5}.world{position:absolute;inset:0}.land{position:absolute;background:#d3deda;opacity:.96}.americas{left:7%;top:16%;width:27%;height:63%;border-radius:52% 48% 58% 42%/30% 34% 66% 70%;transform:rotate(-12deg);clip-path:polygon(26% 0,66% 5%,81% 20%,69% 34%,85% 50%,71% 63%,61% 100%,44% 80%,38% 58%,22% 43%,6% 25%)}.eurasia{left:39%;top:14%;width:52%;height:43%;border-radius:45% 55% 42% 58%;clip-path:polygon(0 27%,9% 10%,29% 6%,41% 0,61% 12%,83% 8%,100% 29%,91% 53%,75% 61%,60% 54%,50% 81%,31% 68%,17% 76%,8% 55%)}.africa{left:47%;top:42%;width:19%;height:34%;border-radius:44% 56% 62% 38%;clip-path:polygon(29% 0,73% 3%,98% 28%,75% 68%,55% 100%,31% 83%,0 35%)}.australia{right:8%;bottom:13%;width:15%;height:17%;border-radius:50%;transform:rotate(-8deg)}.greenland{left:28%;top:5%;width:9%;height:13%;border-radius:50% 40% 60% 45%;transform:rotate(14deg)}.live{position:absolute;left:18px;top:18px;background:rgba(255,255,255,.92);border:1px solid rgba(20,52,70,.12);border-radius:999px;padding:10px 14px;font-size:11px;font-weight:850;display:flex;gap:8px;align-items:center;z-index:5}.dot{width:8px;height:8px;border-radius:50%;background:#32c76b}.marker{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:inherit;padding:0;text-align:left;z-index:4}.avatar{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 8px 25px rgba(0,0,0,.14);display:grid;place-items:center;color:#003c70;font-weight:900;font-size:16px}.who{font-size:14px;font-weight:900;text-shadow:0 0 5px #eaf4f5,0 0 5px #eaf4f5}.where{font-size:10px;color:#6f818d;font-weight:800;text-shadow:0 0 4px #eaf4f5,0 0 4px #eaf4f5}.detail{position:absolute;right:18px;top:18px;width:min(330px,calc(100% - 36px));background:rgba(255,255,255,.96);border:1px solid rgba(20,52,70,.12);border-radius:24px;padding:18px;z-index:8;box-shadow:0 18px 55px rgba(14,39,53,.12);display:none}.detail.show{display:block}.close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:24px;cursor:pointer}.detail h2{margin:0 30px 4px 0;font-size:23px;letter-spacing:-.03em}.place{color:#00aaff;font-weight:850;font-size:12px}.trip{border-top:1px solid rgba(20,52,70,.12);margin-top:14px;padding-top:13px;color:#6f818d;font-size:13px;line-height:1.45}.period{margin-top:8px;color:#6f818d;font-size:11px}.nav{display:grid;grid-template-columns:48px 1fr 48px;gap:12px;align-items:center;margin-top:16px}.arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(20,52,70,.12);background:transparent;font-size:23px;color:#163247;cursor:pointer}.days{display:grid;grid-template-columns:repeat(11,1fr);gap:5px}.day{border:0;background:transparent;border-radius:14px;padding:9px 4px;color:#71838f;cursor:pointer}.day.active{background:#fff;color:#163247}.day .wd{font-size:9px;text-transform:uppercase;font-weight:850}.day .dn{font-size:18px;font-weight:900}.day .sig{width:5px;height:5px;border-radius:50%;margin:5px auto 0;background:transparent}.day.has .sig{background:#ff8200}.day.active .sig{background:#00aaff}.caption{text-align:center;color:#71838f;font-size:10px;margin-top:10px}.empty{position:absolute;inset:0;display:none;place-items:center;color:#71838f;font-size:18px;z-index:3}.empty.show{display:grid}@media(max-width:760px){.app{padding:14px}.map{min-height:510px}.days{grid-template-columns:repeat(11,60px);overflow-x:auto}.detail{left:14px;right:14px;top:auto;bottom:14px;width:auto}.date{display:none}.marker .who{font-size:12px}.marker .where{font-size:9px}.avatar{width:48px;height:48px}} </style></head><body><main class="app"><div class="top"><div class="brand"><div class="logo">G</div><div><div class="eyebrow">Golfpassi</div><div class="title">Maailmalla</div></div></div><div class="date" id="dateText"></div></div><section class="map"><div class="world"><div class="land americas"></div><div class="land eurasia"></div><div class="land africa"></div><div class="land australia"></div><div class="land greenland"></div></div><div class="live"><span class="dot"></span><span id="count"></span></div><div id="markers"></div><div class="empty" id="empty">Tänä päivänä kartalla ei ole matkanvetäjiä.</div><aside class="detail" id="detail"><button class="close" id="close" aria-label="Sulje">×</button><h2 id="dn"></h2><div class="place" id="dp"></div><div class="trip" id="dt"></div><div class="period" id="dd"></div></aside></section><div class="nav"><button class="arrow" id="prev">←</button><div class="days" id="days"></div><button class="arrow" id="next">→</button></div><div class="caption">Klikkaa ihmistä. Ei raportteja – vain kuka on missä.</div></main><script>const trips=[{leader:'Anu Alppi',place:'Fairplay',country:'Espanja',trip:'Fairplay Golf & Spa Resort',start:'2026-10-22',end:'2026-11-05',x:47,y:45},{leader:'Juha-Matti Vuorinen',place:'Rio Real',country:'Espanja',trip:'Rio Real Golf & Hotel',start:'2026-10-21',end:'2026-11-18',x:48,y:43},{leader:'Sonja Pakonen',place:'La Sella',country:'Espanja',trip:'Denia Marriott La Sella Golf Resort & Spa',start:'2026-10-25',end:'2026-11-01',x:50,y:42},{leader:'Tatu Toivo',place:'CampoReal',country:'Portugali',trip:'Dolce CampoReal',start:'2026-10-28',end:'2026-11-04',x:45,y:42},{leader:'Tomi Pund',place:'Mar Menor',country:'Espanja',trip:'Ona Mar Menor',start:'2026-10-30',end:'2026-11-06',x:50,y:45},{leader:'Joel Virtanen',place:'Marrakech',country:'Marokko',trip:'Riu Tikida Palmeraie',start:'2026-11-14',end:'2026-11-21',x:47,y:51},{leader:'Tero Simola',place:'La Finca',country:'Espanja',trip:'Golf & fysiikka La Finca Resort',start:'2026-11-29',end:'2026-12-06',x:50,y:44},{leader:'Niklas Virta',place:'La Finca',country:'Espanja',trip:'Golf & fysiikka La Finca Resort',start:'2026-11-29',end:'2026-12-06',x:53,y:46}];let selected='2026-10-24';const p=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c))},iso=d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`,add=(s,n)=>{const d=p(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)},active=s=>trips.filter(t=>s>=t.start&&s<=t.end),fmt=s=>new Intl.DateTimeFormat('fi-FI',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(p(s)),short=s=>new Intl.DateTimeFormat('fi-FI',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'}).format(p(s)),init=n=>n.split(/\s+/).map(x=>x[0]).slice(0,2).join('');function show(t){dn.textContent=t.leader;dp.textContent=`${t.place}, ${t.country}`;dt.textContent=t.trip;dd.textContent=`${short(t.start)} – ${short(t.end)}`;detail.classList.add('show')}function render(){dateText.textContent=fmt(selected);const a=active(selected);count.textContent=`${a.length} ${a.length===1?'matkanvetäjä':'matkanvetäjää'} maailmalla`;markers.innerHTML='';empty.classList.toggle('show',!a.length);detail.classList.remove('show');a.forEach((t,i)=>{const b=document.createElement('button');b.className='marker';b.style.left=`${t.x+i*.6}%`;b.style.top=`${t.y+i*1.3}%`;b.innerHTML=`<span class="avatar">${init(t.leader)}</span><span><span class="who">${t.leader}</span><br><span class="where">${t.place}</span></span>`;b.onclick=()=>show(t);markers.appendChild(b)});days.innerHTML='';for(let i=-5;i<=5;i++){const s=add(selected,i),d=p(s),b=document.createElement('button');b.className='day '+(active(s).length?'has ':'')+(i===0?'active':'');b.innerHTML=`<div class="wd">${new Intl.DateTimeFormat('fi-FI',{weekday:'short',timeZone:'UTC'}).format(d)}</div><div class="dn">${d.getUTCDate()}</div><div class="sig"></div>`;b.onclick=()=>{selected=s;render()};days.appendChild(b)}}prev.onclick=()=>{selected=add(selected,-7);render()};next.onclick=()=>{selected=add(selected,7);render()};close.onclick=()=>detail.classList.remove('show');render();</script></body></html>
