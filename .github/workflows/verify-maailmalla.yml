name: Verify Golfpassi Maailmalla

on:
  push:
    branches:
      - golfpassi-maailmalla-preview
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Wait for Vercel production deployment
        run: sleep 45

      - name: Verify live Golfpassi data and audit
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            code=$(curl -L -sS --max-time 75 -o /tmp/data.json -w "%{http_code}" https://golfpassi-maailmalla.vercel.app/api/data || true)
            if [ "$code" = "200" ]; then break; fi
            echo "API returned $code, retry $i/10"
            sleep 10
          done
          python3 - <<'PY'
          import json
          import urllib.parse
          from pathlib import Path
          p=Path('/tmp/data.json')
          if not p.exists(): raise SystemExit('API response missing')
          data=json.loads(p.read_text())
          if not data.get('ok'): raise SystemExit(f"API not ok: {data}")
          items=data.get('assignments') or []
          if len(items) < 5: raise SystemExit(f"Too few assignments: {len(items)}")
          required={'leader','place','start','end','profile','tripUrl'}
          for item in items:
              missing=[k for k in required if not item.get(k)]
              if missing: raise SystemExit(f"Missing fields {missing}: {item}")
          audit=data.get('audit') or {}
          exact=audit.get('exactLocations',0)
          verified=audit.get('tripVerified',0)
          checked=sum(bool(x.get('tripPageChecked')) for x in items)
          severe=audit.get('severeCount',999)
          warnings=audit.get('warningCount',0)
          overrides=len(audit.get('sourceOverrides',[]))
          print(f"Assignments: {len(items)} | exact locations: {exact} | trip pages checked: {checked} | leader verified on trip page: {verified} | source overrides: {overrides} | severe: {severe} | warnings: {warnings}")
          if exact != len(items):
              raise SystemExit(f"Not all destinations are exact: {exact}/{len(items)}")
          if checked < max(1, int(len(items)*0.8)):
              raise SystemExit(f"Too few trip pages checked: {checked}/{len(items)}")
          if severe:
              raise SystemExit(f"Severe data audit issues: {severe}")
          if verified < max(1, int(len(items)*0.15)):
              raise SystemExit(f"Trip-page leader verification parser may be broken: {verified}/{len(items)}")
          sample=items[0]
          query=urllib.parse.urlencode({'profile':sample['profile'],'name':sample['leader']})
          Path('/tmp/avatar-url.txt').write_text('https://golfpassi-maailmalla.vercel.app/api/avatar?'+query)
          PY

      - name: Verify Golfpassi destination layer
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS --max-time 75 -o /tmp/destinations.json -w "%{http_code}" https://golfpassi-maailmalla.vercel.app/api/destinations)
          test "$code" = "200"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/destinations.json').read_text())
          if not data.get('ok'): raise SystemExit(f"Destination API not ok: {data}")
          items=data.get('destinations') or []
          if len(items) < 25: raise SystemExit(f"Too few Golfpassi destination points: {len(items)}")
          for item in items:
              for key in ('place','country','lat','lon','tripCount'):
                  if item.get(key) is None or item.get(key)=='': raise SystemExit(f"Destination missing {key}: {item}")
          exact=sum(x.get('accuracy')=='exact' for x in items)
          print(f"Verified {len(items)} Golfpassi destination points; {exact} exact")
          if exact < int(len(items)*0.8): raise SystemExit(f"Too many approximate destination points: {exact}/{len(items)}")
          PY

      - name: Verify profile avatar resolver
        shell: bash
        run: |
          set -euo pipefail
          avatar_url=$(cat /tmp/avatar-url.txt)
          code=$(curl -L -sS --max-time 30 -o /tmp/avatar.bin -w "%{http_code}" "$avatar_url")
          test "$code" = "200"
          test -s /tmp/avatar.bin
          echo "Profile avatar resolver OK"

      - name: Verify production page
        run: curl -fL --retry 4 --retry-delay 5 https://golfpassi-maailmalla.vercel.app/ >/dev/null
