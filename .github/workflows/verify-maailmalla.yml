name: Verify Golfpassi Maailmalla

on:
  push:
    branches:
      - golfpassi-maailmalla-preview
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 45

      - name: Verify live Golfpassi data API
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..8}; do
            code=$(curl -L -sS -o /tmp/data.json -w "%{http_code}" https://golfpassi-maailmalla.vercel.app/api/data || true)
            if [ "$code" = "200" ]; then break; fi
            echo "API returned $code, retry $i/8"
            sleep 10
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/data.json')
          if not p.exists(): raise SystemExit('API response missing')
          data=json.loads(p.read_text())
          if not data.get('ok'): raise SystemExit(f"API not ok: {data}")
          items=data.get('assignments') or []
          if len(items) < 5: raise SystemExit(f"Too few assignments: {len(items)}")
          required={'leader','place','start','end','profile','tripUrl'}
          for item in items:
              missing=[k for k in required if not item.get(k)]
              if missing: raise SystemExit(f"Missing fields {missing}: {item}")
          images=sum(bool(x.get('imageUrl')) for x in items)
          print(f"Verified {len(items)} assignments; {images} with profile images")
          if images < 1: raise SystemExit('No profile images detected')
          PY

      - name: Verify production page
        run: curl -fL --retry 4 --retry-delay 5 https://golfpassi-maailmalla.vercel.app/ >/dev/null
