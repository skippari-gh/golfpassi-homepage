name: Debug destination accuracy

on:
  push:
    branches:
      - golfpassi-maailmalla-preview

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print approximate destinations
        shell: bash
        run: |
          sleep 35
          curl -L -sS --max-time 75 https://golfpassi-maailmalla.vercel.app/api/destinations > /tmp/d.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/d.json'))
          for x in d.get('destinations',[]):
              if x.get('accuracy')!='exact': print(json.dumps(x,ensure_ascii=False))
          PY
